<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Clicker Game</title>
  <style>
    body, dialog {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin-bottom: 80px;
      
      /* Prevents text highlighting on double-clicking */
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Scrollable shop panel setup */
    .vertical-scroll-box {
      overflow-y: scroll; 
      height: 250px; 
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .scroll-btn {
      font-size: 20px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #999;
      background-color: #f8f9fa;
    }

    .scroll-btn:hover {
      background-color: #e2e6ea;
    }

    .main-clicker {
      height: 80px; 
      font-size: 25px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
    }

    .main-clicker:hover {
      background-color: #0056b3;
    }

    /* Bottom center utility button alignment */
    .bottom-button-container {
      position: fixed;
      bottom: 15px;          
      left: 0;
      width: 100%;          
      display: flex;
      justify-content: center; 
      gap: 12px;            
      z-index: 1000;        
    }

    .bottom-btn {
      font-size: 15px;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #fff;
    }

    .bottom-btn:hover {
      background-color: #f0f0f0;
    }

    /* Quick escape panic button styling */
    .panic-btn {
      position: fixed; 
      top: 10px; 
      right: 10px; 
      font-size: 14px; 
      background-color: #dc3545; 
      color: white; 
      font-weight: bold;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .panic-btn:hover {
      background-color: #bd2130;
    }

    /* Floating cursor text animation */
    .floating-number {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      user-select: none;
      animation: floatAndFade 0.8s ease-out forwards;
      z-index: 2000;
    }

    @keyframes floatAndFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(1);
      }
      50% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-50px) scale(1.2);
      }
    }
    
    dialog {
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

<h1>Simple Clicker Game</h1>

<!-- Tracking Headers -->
<h2 id="scr">Score: 0</h2>
<h3 id="pwr">Click Power: 1</h3>
<h3 id="auto">Autoclicks/Second: 0</h3>
<h3 id="mode">Hard Mode : OFF</h3>

<!-- Main Clicker Button -->
<button class="scroll-btn main-clicker">Click to Score</button>

<!-- Scrollable Action Box -->
<div class="vertical-scroll-box">

  <!-- Upgrades -->
  <button id="btn-plusone" class="scroll-btn" onclick="
    if (score >= pluscost) {
      plusonepurchases++;
      score -= pluscost;
      clickvalue += 1; 
      pluscost = Math.round(pluscost * 1.5);
      updateUI();
      saveGame();
    } else {
      alert('You don\'t have enough! Required: ' + (pluscost - Math.floor(score)) + ' points');
    }
  ">+1 Click Power (50)</button>
  
  <button id="btn-plusoneauto" class="scroll-btn" onclick="
    if (score >= oneautocost) {
      oneautopurchases++;
      score -= oneautocost;
      autoclick += 1; 
      oneautocost = Math.round(oneautocost * 1.5);
      updateUI();
      saveGame();
    } else {
      alert('You don\'t have enough! Required: ' + (oneautocost - Math.floor(score)) + ' points');
    }
  ">+1 Autoclick/Second (100)</button>

  <button id="btn-xtwo" class="scroll-btn" onclick="
    if (score >= xtwocost) {
      xtwopurchases++;
      score -= xtwocost;
      clickvalue *= 2; 
      xtwocost = Math.round(xtwocost * 2.5);
      updateUI();
      saveGame();
    } else {
      alert('You don\'t have enough! Required: ' + (xtwocost - Math.floor(score)) + ' points');
    }
  ">x2 Click Power (500)</button>

  <button id="btn-plusten" class="scroll-btn" onclick="
    if (score >= plustencost) {
      plustenpurchases++;
      score -= plustencost;
      clickvalue += 10; 
      plustencost = Math.round(plustencost * 1.8); 
      updateUI();
      saveGame();
    } else {
      alert('You don\'t have enough! Required: ' + (plustencost - Math.floor(score)) + ' points');
    }
  ">+10 Click Power (500)</button>
  
  <button id="btn-plustenauto" class="scroll-btn" onclick="
    if (score >= tenautocost) {
      tenautopurchases++;
      score -= tenautocost;
      autoclick += 10; 
      tenautocost = Math.round(tenautocost * 2);
      updateUI();
      saveGame();
    } else {
      alert('You don\'t have enough! Required: ' + (tenautocost - Math.floor(score)) + ' points');
    }
  ">+10 Autoclick/Second (1000)</button>

</div>

<!-- Top Panic Button -->
<button class="panic-btn" onclick="panic();">
  PRESS WHEN IN TROUBLE OR CLICK ESC
</button>

<!-- Center-Bottom Row Utility Controls -->
<div class="bottom-button-container">
  <button class="bottom-btn" onclick="
    modecount++;
    document.getElementById('mode').innerText = (modecount % 2 == 0) ? 'Hard Mode: OFF' : 'Hard Mode: ON';
    saveGame();
  ">Toggle Difficulty</button>

  <button class="bottom-btn" onclick="
    alert('Stats:\nTotal clicks: ' + totalclicks + '\n+1 Upgrades: ' + plusonepurchases + '\nx2 Upgrades: ' + xtwopurchases + '\n+10 Upgrades: ' + plustenpurchases + '\nAutoclicks/Sec: ' + autoclick);
  ">Click to See Stats</button>

  <button class="bottom-btn" onclick="
    if (resetcheck == 1) {
      localStorage.removeItem('clickerSave');
      score = 0; autoclick = 0; pluscost = 50; xtwocost = 500; plustencost = 500; 
      oneautocost = 100; tenautocost = 1000; clickvalue = 1; modecount = 0; resetcheck = 0;
      totalclicks = 0; plusonepurchases = 0; xtwopurchases = 0; plustenpurchases = 0;
      oneautopurchases = 0; tenautopurchases = 0;
      updateUI();
      document.getElementById('mode').innerText = 'Hard Mode: OFF';
      alert('Reset!');
    } else {
      resetcheck++; 
      alert('Warning: This will reset progress permanently! Press again to confirm.');
    }
  ">Click to Reset</button>
  
  <button class="bottom-btn" command="show-modal" commandfor="abilities">Abilities</button>
</div>

<script>
// Game variables
let score = 0;
let autoclick = 0;
let clickvalue = 1;
let pluscost = 50;
let xtwocost = 500;
let plustencost = 500;
let oneautocost = 100;
let tenautocost = 1000;
let totalclicks = 0;
let plusonepurchases = 0;
let xtwopurchases = 0;
let plustenpurchases = 0;
let oneautopurchases = 0;
let tenautopurchases = 0;
let modecount = 0;
let resetcheck = 0;

// Refreshes HUD labels and updates cost markers + buy indicators inside buttons
function updateUI() {
  document.getElementById('scr').innerText = 'Score: ' + Math.floor(score);
  document.getElementById('pwr').innerText = 'Click Power: ' + clickvalue;
  document.getElementById('auto').innerText = 'Autoclicks/Second: ' + autoclick;
  
  let plusoneInfo = (score >= pluscost) ? ' [CAN BUY!]' : ' (Need ' + (pluscost - Math.floor(score)) + ' more)';
  document.getElementById('btn-plusone').innerText = '+1 Click Power | Cost: ' + pluscost + plusoneInfo;
  
  let xtwoInfo = (score >= xtwocost) ? ' [CAN BUY!]' : ' (Need ' + (xtwocost - Math.floor(score)) + ' more)';
  document.getElementById('btn-xtwo').innerText = 'x2 Click Power | Cost: ' + xtwocost + xtwoInfo;

  let plustenInfo = (score >= plustencost) ? ' [CAN BUY!]' : ' (Need ' + (plustencost - Math.floor(score)) + ' more)';
  document.getElementById('btn-plusten').innerText = '+10 Click Power | Cost: ' + plustencost + plustenInfo;

  let autoInfo = (score >= oneautocost) ? ' [CAN BUY!]' : ' (Need ' + (oneautocost - Math.floor(score)) + ' more)';
  document.getElementById('btn-plusoneauto').innerText = '+1 Autoclick/Sec | Cost: ' + oneautocost + autoInfo;
  
  let tenAutoInfo = (score >= tenautocost) ? ' [CAN BUY!]' : ' (Need ' + (tenautocost - Math.floor(score)) + ' more)';
  document.getElementById('btn-plustenauto').innerText = '+10 Autoclick/Sec | Cost: ' + tenautocost + tenAutoInfo;
}

// Save and Load Functions
function saveGame() {
  localStorage.setItem("clickerSave", JSON.stringify({
    score, autoclick, clickvalue, pluscost, xtwocost, plustencost, 
    oneautocost, tenautocost, totalclicks, plusonepurchases, 
    xtwopurchases, plustenpurchases, oneautopurchases, tenautopurchases,
    modecount
  }));
}

function loadGame() {
  const saved = localStorage.getItem("clickerSave");
  if (saved) {
    Object.assign(window, JSON.parse(saved));
  }
}

// Background autoclick engine
let lastUpdate = Date.now();

setInterval(function() {
  let now = Date.now();
  let deltaSeconds = (now - lastUpdate) / 1000;
  
  if (autoclick > 0) {
    score += autoclick * deltaSeconds;
    updateUI();
  }
  
  saveGame();
  
  lastUpdate = now;
}, 250);

// Autoclick engine; adds score from time missed
document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    let now = Date.now();
    let deltaSeconds = (now - lastUpdate) / 1000;
    
    if (autoclick > 0) {
      score += autoclick * deltaSeconds;
      updateUI();
    }
    lastUpdate = now;
  }
});

// Floating cursor text creator
function spawnFloatingText(x, y, text) {
  const el = document.createElement("span");
  el.className = "floating-number";
  el.innerText = "+" + text;
  
  el.style.left = x + "px";
  el.style.top = y + "px";
  
  document.body.appendChild(el);
  
  setTimeout(() => {
    el.remove();
  }, 800);
}

// Global Click Listener
window.addEventListener("click", function(event) {
  const target = event.target;
  if (target.closest("dialog")) {
    return;
  }
  const isMainTarget = target.classList.contains("main-clicker");

  if (!isMainTarget && target.tagName === "BUTTON") {
    return;
  }

  // Calculate score (2x reward for main button target)
  let pointsGained = isMainTarget ? (clickvalue * 2) : clickvalue;

  if (isMainTarget && modecount % 2 !== 0) {
    target.blur();
  }

  totalclicks++;
  score += pointsGained;
  resetcheck = 0;
  updateUI();
  saveGame();

  let spawnX = event.pageX;
  let spawnY = event.pageY;

  // Handle keyboard (Space/Enter) triggers by centering floating text on the main button
  if (event.detail === 0 || (spawnX === 0 && spawnY === 0)) {
    const mainBtn = document.querySelector(".main-clicker");
    if (mainBtn) {
      const rect = mainBtn.getBoundingClientRect();
      spawnX = rect.left + window.scrollX + (rect.width / 2);
      spawnY = rect.top + window.scrollY + (rect.height / 2);
    }
  }

  spawnFloatingText(spawnX, spawnY, pointsGained);
});

// Panic function to Google Classroom
function panic() {
  window.open('https://classroom.google.com', '_self');
}

// Global Key Listeners
window.addEventListener("keydown", function(event) {
  if (event.key === "Escape" || event.key === "Esc") { panic(); }
});

window.addEventListener("keydown", function(event) {
  if (event.altKey && event.shiftKey && event.key.toLowerCase() === 'd') {
    alert('Developer Mode enabled.');
    score = Number(prompt("Enter score:", score));
    clickvalue = Number(prompt("Enter click power:", clickvalue));
    autoclick = Number(prompt("Enter automated autoclicks per second:", autoclick));
    updateUI();
    saveGame();
  }
});

// Load saved data and initialize screen
loadGame();
document.getElementById('mode').innerText = (modecount % 2 === 0) ? 'Hard Mode: OFF' : 'Hard Mode: ON';
updateUI();
</script>

<!-- Abilities shop -->
<dialog id="abilities">
  <button style="font-size: 10px" command="close" commandfor="abilities">X</button>
  <h2>Abilities</h2>
  <h3>Active Click Power</h3>
  <p>Earn click power for every click</p>
  <button>Purchase</button>
</dialog>

</body>
</html>
